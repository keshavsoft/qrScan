<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Search & Table | JSON to DOM (v8)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- json-to-dom CDN -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/keshavsoft/json-to-dom/docs/dist/v3/min.js"></script>
    <style>
        .text-small {
            font-size: 0.85rem;
        }

        .nav-link {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .nav-link:hover {
            color: #0dcaf0 !important;
        }

        .nav-link.active {
            color: #0d6efd !important;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 36px;
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 1.25rem;
            text-decoration: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 991.98px) {
            .navbar-collapse {
                background: #212529;
                padding: 1rem 0.5rem;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                margin-top: 0.5rem;
                border-radius: 8px;
            }

            .navbar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 0.5rem;
            }

            .navbar-nav .nav-item {
                min-width: 70px;
            }
        }
        /* Active/clicked filter row highlight */
        .filter-row-active {
            background-color: rgba(13, 110, 253, 0.08);
            border-radius: 6px;
            outline: 1.5px solid rgba(13, 110, 253, 0.35);
            transition: background-color 0.2s ease, outline 0.2s ease;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Dynamic Header & Menu rendered by json-to-dom-menu -->
    <div id="header-container"></div>

    <main class="container-fluid px-4 pb-5">
        <!-- Search Filter Card Container -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                <span class="fw-semibold text-secondary">
                    <i class="bi bi-funnel me-1"></i> Filters
                </span>
                <button id="card-clear-filters-btn" type="button" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-x-circle me-1"></i> Clear
                </button>
            </div>
            <div class="card-body">
                <div id="filter-container"></div>
            </div>
        </div>

        <!-- Table Card Container -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div id="table-container" class="table-responsive"></div>
            </div>
        </div>

        <!-- Datalist Container -->
        <div id="datalist-container"></div>
    </main>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
