<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Search & Table | JSON to DOM (v7)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- json-to-dom CDN -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/keshavsoft/json-to-dom/docs/dist/v3/min.js"></script>
    <style>
        .text-small {
            font-size: 0.85rem;
        }

        .nav-link {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .nav-link:hover {
            color: #0dcaf0 !important;
        }

        .nav-link.active {
            color: #0d6efd !important;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 36px;
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 1.25rem;
            text-decoration: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 991.98px) {
            .navbar-collapse {
                background: #212529;
                padding: 1rem 0.5rem;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                margin-top: 0.5rem;
                border-radius: 8px;
            }

            .navbar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 0.5rem;
            }

            .navbar-nav .nav-item {
                min-width: 70px;
            }
        }
    </style>
</head>

<body class="bg-light">
    <!-- Header with Normal Menu on Desktop and Hamburger on Mobile -->
    <header class="mb-4 shadow-sm">
        <!-- Top Dark Bar -->
        <div class="px-3 py-2 text-bg-dark border-bottom">
            <div class="container-fluid px-2 px-md-4 d-flex flex-wrap align-items-center justify-content-between">
                <!-- Brand on Left -->
                <a href="./" class="d-flex align-items-center text-white text-decoration-none my-1">
                    <span class="brand-icon me-2">B</span>
                    <div class="d-flex flex-column">
                        <span class="fs-5 fw-bold lh-1">Purchases</span>
                        <small class="text-secondary" style="font-size: 0.72rem;">Hybrid Search & Table (v7)</small>
                    </div>
                </a>

                <!-- Desktop Normal Menu (Visible on Desktop/Tablet >= 768px, Hidden on Mobile) -->
                <ul class="nav d-none d-md-flex align-items-center my-1 text-small text-center">
                    <li>
                        <a href="#" class="nav-link text-white px-3">
                            <i class="bi bi-house d-block mx-auto mb-1 fs-5"></i>
                            Home
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white px-3">
                            <i class="bi bi-speedometer2 d-block mx-auto mb-1 fs-5"></i>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link active text-white px-3">
                            <i class="bi bi-table d-block mx-auto mb-1 fs-5"></i>
                            Orders
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white px-3">
                            <i class="bi bi-grid d-block mx-auto mb-1 fs-5"></i>
                            Products
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white px-3">
                            <i class="bi bi-people d-block mx-auto mb-1 fs-5"></i>
                            Customers
                        </a>
                    </li>
                    <li>
                        <a href="#" id="nav-reset-btn" class="nav-link text-info px-3"
                            title="Instantly reset filtered data without reloading page">
                            <i class="bi bi-arrow-clockwise d-block mx-auto mb-1 fs-5"></i>
                            Reset
                        </a>
                    </li>
                </ul>

                <!-- Mobile Hamburger Button on Right (Visible on Mobile < 768px only) -->
                <button class="btn btn-outline-secondary text-white border-secondary d-md-none my-1 px-2 py-1"
                    type="button" data-bs-toggle="collapse" data-bs-target="#mobileNavCollapse"
                    aria-controls="mobileNavCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="bi bi-list fs-3 lh-1"></i>
                </button>
            </div>

            <!-- Mobile Collapsible Menu (Only rendered on Mobile < 768px) -->
            <div class="collapse d-md-none" id="mobileNavCollapse">
                <div class="container-fluid px-2 pt-3 pb-2 border-top border-secondary mt-2">
                    <div class="row row-cols-3 g-2 text-center text-small">
                        <div class="col">
                            <a href="#" class="nav-link text-white py-2 rounded bg-dark border border-secondary">
                                <i class="bi bi-house d-block mx-auto mb-1 fs-4"></i>
                                Home
                            </a>
                        </div>
                        <div class="col">
                            <a href="#" class="nav-link text-white py-2 rounded bg-dark border border-secondary">
                                <i class="bi bi-speedometer2 d-block mx-auto mb-1 fs-4"></i>
                                Dashboard
                            </a>
                        </div>
                        <div class="col">
                            <a href="#" class="nav-link text-white py-2 rounded bg-dark border border-primary">
                                <i class="bi bi-table d-block mx-auto mb-1 fs-4 text-primary"></i>
                                <span class="text-primary fw-semibold">Orders</span>
                            </a>
                        </div>
                        <div class="col">
                            <a href="#" class="nav-link text-white py-2 rounded bg-dark border border-secondary">
                                <i class="bi bi-grid d-block mx-auto mb-1 fs-4"></i>
                                Products
                            </a>
                        </div>
                        <div class="col">
                            <a href="#" class="nav-link text-white py-2 rounded bg-dark border border-secondary">
                                <i class="bi bi-people d-block mx-auto mb-1 fs-4"></i>
                                Customers
                            </a>
                        </div>
                        <div class="col">
                            <a href="#" id="mobile-nav-reset-btn"
                                class="nav-link text-info py-2 rounded bg-dark border border-info"
                                title="Instantly reset filtered data">
                                <i class="bi bi-arrow-clockwise d-block mx-auto mb-1 fs-4"></i>
                                Reset
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lower Sub-Header Toolbar -->
        <div class="px-3 py-2 border-bottom bg-white">
            <div class="container-fluid px-2 px-md-4 d-flex flex-wrap align-items-center justify-content-between gap-2">
                <!-- Status badge info -->
                <div class="d-flex align-items-center">
                    <span class="text-secondary small me-2">Status:</span>
                    <span id="record-count-badge" class="badge bg-secondary">Loading records...</span>
                </div>

                <!-- Action buttons -->
                <div class="d-flex gap-2">
                    <button id="header-reset-btn" type="button" class="btn btn-sm btn-primary">
                        <i class="bi bi-arrow-clockwise me-1"></i> Reset Filters
                    </button>
                    <button id="header-reload-btn" type="button" class="btn btn-sm btn-outline-secondary"
                        title="Full refresh from server">
                        <i class="bi bi-cloud-arrow-down me-1"></i> Reload Server
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid px-4 pb-5">
        <!-- Search Filter Card Container -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                <span class="fw-semibold text-secondary">
                    <i class="bi bi-funnel me-1"></i> Filters
                </span>
                <button id="card-clear-filters-btn" type="button" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-x-circle me-1"></i> Clear
                </button>
            </div>
            <div class="card-body">
                <div id="filter-container"></div>
            </div>
        </div>

        <!-- Table Card Container -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div id="table-container" class="table-responsive"></div>
            </div>
        </div>

        <!-- Datalist Container -->
        <div id="datalist-container"></div>
    </main>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
